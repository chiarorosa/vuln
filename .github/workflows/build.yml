name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Fetch verified dependencies
        working-directory: desktop
        run: |
          node setup-deps.mjs
          node setup-workspace-deps.mjs
      - name: Build and run integration suite
        working-directory: desktop
        shell: pwsh
        run: .\test.ps1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vuln-build
          path: |
            desktop/dist-vuln/
            desktop/build/vuln-test-results.txt
