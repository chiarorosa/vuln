name: Bug report
description: Something in VULN does not work as expected
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: VULN version or commit
      placeholder: 3.2.1
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Windows version
      placeholder: Windows 11 23H2
  - type: dropdown
    id: tool
    attributes:
      label: Tool
      options: [Proxy, Repeater, Intruder, Scanner, WebSockets, Target, Decoder, Sequencer, Comparer, TLS, Extensions, Projects, Wiki, Build/packaging, Other]
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Use local or authorized targets only. Remove credentials and personal data from any request or response you paste.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected vs. actual behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
